<style>
:root{
  --azul:#13215E;--dourado:#EFAD4C;--creme:#F5F0DC;--fundo:#FDFBF5;--branco:#fff;
  --tinta-suave:#5A6283;--linha:rgba(19,33,94,.12);
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:1rem;line-height:1.55;color:var(--azul);background:var(--fundo);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dourado);outline-offset:2px;border-radius:6px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;line-height:1.1;font-optical-sizing:none;font-variation-settings:"opsz" 11}
.conteiner{width:100%;max-width:1140px;margin:0 auto;padding:0 1.25rem}
.oculto{display:none !important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:50px;padding:0 1.4rem;border-radius:999px;border:0;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:background-color .2s}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-azul{background:var(--azul);color:var(--creme)}
.btn-azul:hover{background:#1D2E7C}

/* cabecalho */
.cabecalho{position:sticky;top:0;z-index:20;background:rgba(253,251,245,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linha)}
.cabecalho .conteiner{display:flex;align-items:center;justify-content:space-between;height:64px}
.marca img{height:48px;width:auto}
.cab-link{font-size:.9rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;color:var(--tinta-suave)}
.cab-link svg{width:16px;height:16px}

/* topo */
.hero{position:relative;overflow:hidden;padding:1.75rem 0 2rem}
.hero .conteiner{position:relative;z-index:1}
.hero-grade{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}
.hero h1{font-size:2.4rem}
.hero p{color:var(--tinta-suave);margin-top:.7rem;font-size:.98rem;max-width:44ch}
.hero-foto{position:relative;width:clamp(120px,34vw,160px);aspect-ratio:1}
.aro{position:absolute;inset:0;border-radius:50%;border:4px solid var(--dourado)}
.aro::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--azul)}
#hero-foto{position:absolute;inset:11px;width:calc(100% - 22px);height:calc(100% - 22px);border-radius:50%;object-fit:cover;background:var(--creme);transition:opacity .6s ease}
.selo-giro{position:absolute;left:-10%;bottom:-14%;width:52%;aspect-ratio:1;border-radius:50%;background:var(--azul);display:grid;place-items:center;box-shadow:0 10px 30px rgba(19,33,94,.25)}
.selo-giro svg{position:absolute;inset:0;width:100%;height:100%;animation:girar 28s linear infinite}
.selo-giro text{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;fill:var(--dourado);text-transform:uppercase}
.selo-giro b{position:relative;font-family:var(--serif);font-size:1rem;color:var(--creme);font-weight:600;font-optical-sizing:none;font-variation-settings:"opsz" 11}
@keyframes girar{to{transform:rotate(360deg)}}
.granulado{position:absolute;inset:0;z-index:0;pointer-events:none}
.granulado i{position:absolute;width:10px;height:3.5px;border-radius:3px;opacity:0;animation:cair .9s cubic-bezier(.2,.8,.3,1) forwards,flutuar var(--d) ease-in-out infinite alternate}
@keyframes cair{from{opacity:0;transform:translateY(-14px) rotate(var(--r0))}to{opacity:var(--o);transform:translateY(0) rotate(var(--r))}}
@keyframes flutuar{from{transform:translate(0,0) rotate(var(--r))}to{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r) + var(--dr)))}}

/* filtros e grade */
.catalogo{background:var(--creme);border-radius:28px 28px 0 0;padding:1.75rem 0 4rem;min-height:50vh}
.filtros{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;margin-bottom:1.25rem;padding-bottom:.2rem}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex-shrink:0;border:1.5px solid var(--linha);background:var(--branco);border-radius:999px;padding:.5rem 1rem;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.filtros button.sel{background:var(--azul);border-color:var(--azul);color:var(--creme)}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.torta{background:var(--branco);border:1px solid var(--linha);border-radius:20px;overflow:hidden;text-align:left;cursor:pointer;display:flex;flex-direction:column;padding:0;transition:transform .25s ease,box-shadow .25s ease}
.torta:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgba(19,33,94,.35)}
.torta-foto{aspect-ratio:1;width:100%;object-fit:cover;background:var(--creme)}
.sem-foto{aspect-ratio:1;width:100%;display:grid;place-items:center;background:var(--creme);color:var(--dourado)}
.sem-foto svg{width:44px;height:44px}
.torta-info{padding:.8rem .9rem 1rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.torta-cat{font-size:.72rem;font-weight:600;color:var(--tinta-suave)}
.torta h3{font-size:1.15rem}
.torta-desc{font-size:.82rem;color:var(--tinta-suave);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.torta-preco{margin-top:auto;padding-top:.4rem;font-weight:600;font-size:.9rem}
.vazio{text-align:center;background:var(--branco);border:1px solid var(--linha);border-radius:24px;padding:3rem 1.5rem;max-width:520px;margin:0 auto}
.vazio h2{font-size:1.7rem;margin-bottom:.5rem}
.vazio p{color:var(--tinta-suave);margin-bottom:1.4rem}

/* detalhe */
.fundo-modal{position:fixed;inset:0;background:rgba(19,33,94,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.fundo-modal.aberto{display:flex}
.janela{background:var(--fundo);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;position:relative}
.janela-foto{width:100%;aspect-ratio:1;object-fit:cover;background:var(--creme)}
.janela .sem-foto{border-radius:0}
.fechar{position:absolute;top:.9rem;right:.9rem;width:42px;height:42px;border-radius:50%;border:0;background:rgba(253,251,245,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(19,33,94,.2);z-index:2}
.fechar svg{width:18px;height:18px}
.janela-corpo{padding:1.4rem 1.3rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
.janela h2{font-size:1.9rem;margin-top:.2rem}
.janela-desc{color:var(--tinta-suave);margin-top:.7rem}
.fichas{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.ficha{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:.55rem .85rem;font-size:.85rem}
.ficha b{display:block;font-size:.72rem;color:var(--tinta-suave);font-weight:600}
.bloco-titulo{font-family:var(--serif);font-size:1.25rem;margin:1.4rem 0 .6rem;font-optical-sizing:none;font-variation-settings:"opsz" 11}
.ingredientes{list-style:none;background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:.3rem 1rem}
.ingredientes li{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--linha);font-size:.92rem}
.ingredientes li:last-child{border-bottom:0}
.ingredientes li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dourado);flex-shrink:0}
.alergia{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;background:var(--creme);border-radius:14px;padding:.8rem 1rem;font-size:.85rem}
.alergia svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:#B8792A}
.janela .btn{width:100%;margin-top:1.4rem}

.rodape{background:var(--azul);color:rgba(245,240,220,.75);padding:2rem 0;font-size:.88rem}
.rodape .conteiner{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1rem 1.5rem;text-align:center}
.rodape img{width:72px;height:auto}
.rodape a{color:var(--creme);text-decoration:none}
.rodape .copy{flex-basis:100%}

@media (min-width:720px){
  .hero{padding:3rem 0 3rem}
  .hero h1{font-size:3.6rem}
  .hero p{font-size:1.08rem}
  .hero-foto{width:260px;margin-right:1rem}
  .aro{border-width:6px}.aro::before{inset:6px;border-width:2px}
  #hero-foto{inset:20px;width:calc(100% - 40px);height:calc(100% - 40px)}
  .selo-giro{left:-12%;bottom:-6%;width:42%}
  .selo-giro text{font-size:8.6px;letter-spacing:.2em}
  .selo-giro b{font-size:1.4rem}
  .catalogo{padding:2.5rem 0 5rem}
  .grade{grid-template-columns:repeat(3,1fr);gap:1.25rem}
  .torta h3{font-size:1.35rem}
  .torta-info{padding:1rem 1.2rem 1.2rem}
  .torta-desc{font-size:.88rem}
  .fundo-modal{align-items:center;padding:1.5rem}
  .janela{border-radius:24px;max-width:880px;display:grid;grid-template-columns:1fr 1fr;max-height:88vh}
  .janela-foto,.janela .sem-foto{height:100%;aspect-ratio:auto;min-height:420px}
  .janela-corpo{padding:2rem 1.8rem;overflow-y:auto}
  .rodape .conteiner{justify-content:space-between}
  .rodape .copy{flex-basis:auto}
}
@media (min-width:1080px){.grade{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}.selo-giro svg,.granulado i{animation:none !important}.granulado i{opacity:var(--o)}}
</style>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICONE_BOLO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3M12 8v3M17 8v3"/><path d="M7 4h.01M12 4h.01M17 4h.01"/></svg>';
let tortas = [], filtro = "Todas";

function decFS(v){
  if (!v) return undefined;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(decFS);
  if ("mapValue" in v) { const o = {}; Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => o[k] = decFS(x)); return o; }
  return undefined;
}

async function carregar(){
  try {
    const url = "https://firestore.googleapis.com/v1/projects/" + FIREBASE.projectId + "/databases/(default)/documents:runQuery?key=" + FIREBASE.apiKey;
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      structuredQuery: { from: [{ collectionId: "vitrine" }], where: { fieldFilter: { field: { fieldPath: "tipo" }, op: "EQUAL", value: { stringValue: "torta" } } } }
    }) });
    const j = await r.json();
    tortas = (Array.isArray(j) ? j : []).filter(x => x.document).map(x => decFS({ mapValue: { fields: x.document.fields || {} } }))
      .filter(t => t.nome && t.ativo !== false).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  } catch (e) { tortas = []; }
  montarFiltros(); desenhar(); fotoTopo();
}

function categorias(){ return [...new Set(tortas.map(t => t.categoria).filter(Boolean))]; }
function montarFiltros(){
  const cats = categorias();
  if (cats.length < 2) { $("filtros").classList.add("oculto"); return; }
  $("filtros").innerHTML = ["Todas", ...cats].map(c => `<button type="button" data-c="${esc(c)}" class="${c === filtro ? "sel" : ""}">${esc(c)}</button>`).join("");
  $("filtros").querySelectorAll("button").forEach(b => b.onclick = () => { filtro = b.dataset.c; montarFiltros(); desenhar(); });
}
function desenhar(){
  const g = $("grade");
  if (!tortas.length) {
    g.style.display = "block";
    g.innerHTML = `<div class="vazio"><h2>Catálogo em preparação</h2><p>Estamos fotografando nossas tortas. Enquanto isso, fale com a gente pelo WhatsApp para encomendar.</p>
      <a class="btn btn-azul" href="https://wa.me/${WPP}?text=${encodeURIComponent("Olá, gostaria de saber sobre as tortas!")}" target="_blank" rel="noopener">Falar pelo WhatsApp</a></div>`;
    return;
  }
  g.style.display = "";
  const lista = tortas.map((t, i) => ({ t, i })).filter(x => filtro === "Todas" || x.t.categoria === filtro);
  g.innerHTML = lista.map(({ t, i }) => `
    <button type="button" class="torta" onclick="abrirDetalhe(${i})">
      ${t.imagem ? `<img class="torta-foto" src="${esc(t.imagem)}" alt="${esc(t.nome)}" loading="lazy">` : `<div class="sem-foto">${ICONE_BOLO}</div>`}
      <div class="torta-info">
        ${t.categoria ? `<span class="torta-cat">${esc(t.categoria)}</span>` : ""}
        <h3>${esc(t.nome)}</h3>
        ${t.descricao ? `<p class="torta-desc">${esc(t.descricao)}</p>` : ""}
        ${t.preco ? `<span class="torta-preco">${esc(t.preco)}</span>` : ""}
      </div>
    </button>`).join("");
}

function abrirDetalhe(i){
  const t = tortas[i];
  $("d-foto").innerHTML = t.imagem ? `<img class="janela-foto" src="${esc(t.imagem)}" alt="${esc(t.nome)}">` : `<div class="sem-foto">${ICONE_BOLO}</div>`;
  $("d-cat").textContent = t.categoria || "";
  $("d-nome").textContent = t.nome;
  $("d-desc").textContent = t.descricao || "";
  $("d-fichas").innerHTML = [["Preço", t.preco], ["Rendimento", t.rendimento]].filter(x => x[1]).map(([a, b]) => `<div class="ficha"><b>${a}</b>${esc(b)}</div>`).join("");
  const ing = Array.isArray(t.ingredientes) ? t.ingredientes : [];
  $("d-ing-box").classList.toggle("oculto", !ing.length);
  $("d-ing").innerHTML = ing.map(x => `<li>${esc(x)}</li>`).join("");
  $("d-alerg-box").classList.toggle("oculto", !t.alergenicos);
  $("d-alerg").textContent = t.alergenicos || "";
  $("d-wpp").href = "https://wa.me/" + WPP + "?text=" + encodeURIComponent("Olá, vi no catálogo e gostaria de encomendar: " + t.nome + ".");
  $("detalhe").classList.add("aberto");
  document.body.style.overflow = "hidden";
  $("detalhe").querySelector(".janela").scrollTop = 0;
}
function fecharDetalhe(){ $("detalhe").classList.remove("aberto"); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharDetalhe(); });

// Foto do topo: reveza entre as tortas com foto
function fotoTopo(){
  const img = $("hero-foto"), fotos = tortas.map(t => t.imagem).filter(Boolean);
  if (!fotos.length) return;
  let k = 0; img.src = fotos[0];
  if (fotos.length < 2) return;
  setInterval(() => {
    k = (k + 1) % fotos.length;
    const pre = new Image();
    pre.onload = () => { img.style.opacity = 0; setTimeout(() => { img.src = fotos[k]; img.style.opacity = 1; }, 600); };
    pre.src = fotos[k];
  }, 4500);
}

// Granulado nas cores da marca
(function(){
  const cores = ["#EFAD4C", "#13215E", "#F6C06E", "#D8912A"], larga = innerWidth >= 720;
  let s = 3; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  let html = "";
  for (let i = 0, n = larga ? 26 : 16; i < n; i++) {
    const x = larga ? 62 + rnd() * 36 : 58 + rnd() * 40, y = larga ? 6 + rnd() * 70 : 1 + rnd() * 30, r = Math.round(rnd() * 180);
    html += `<i style="left:${x}%;top:${y}%;background:${cores[i % 4]};--r:${r}deg;--r0:${r - 40}deg;--o:${(.55 + rnd() * .4).toFixed(2)};--d:${(2.6 + rnd() * 2.8).toFixed(2)}s;--dx:${(rnd() * 8 - 4).toFixed(1)}px;--dy:${(4 + rnd() * 7).toFixed(1)}px;--dr:${Math.round(rnd() * 60 - 30)}deg;animation-delay:${i * 25}ms,${i * 25 + 900}ms"></i>`;
  }
  $("granulado").innerHTML = html;
})();

// "Voltar ao site" so para quem veio do site
(function(){
  let doSite = false;
  try {
    const u = new URL(location.href);
    if (u.searchParams.get("de") === "site") { sessionStorage.setItem("deSite", "1"); u.searchParams.delete("de"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
    const ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, "") : "";
    doSite = sessionStorage.getItem("deSite") === "1" || ref === "padariapaoetradicao.com.br";
  } catch (e) {}
  if (doSite) $("link-voltar").classList.remove("oculto");
})();
["link-site", "link-voltar", "link-rodape"].forEach(id => { $(id).href = SITE; });
