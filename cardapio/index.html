<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio | Pão & Tradição</title>
<meta name="description" content="Cardápio da Pão & Tradição em Nova Friburgo: café da manhã, pães, salgados, sanduíches, hambúrgueres, bebidas e sobremesas.">
<meta name="theme-color" content="#13215E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1635" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Cardápio | Pão & Tradição">
<meta property="og:description" content="Nosso cardápio completo, com preços.">
<meta property="og:url" content="https://www.padariapaoetradicao.com.br/cardapio/">
<meta property="og:image" content="https://www.padariapaoetradicao.com.br/img/compartilhar.jpg">
<link rel="canonical" href="https://www.padariapaoetradicao.com.br/cardapio/">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="dados.js"></script>
<style>
:root{
  --azul:#13215E;--dourado:#EFAD4C;--creme:#F5F0DC;
  --fundo:#FFFFFF;--cartao:#FFFFFF;--texto:#13215E;--suave:#3C4566;--linha:rgba(19,33,94,.16);
  --faixa:#13215E;--faixa-texto:#FFFFFF;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --fundo:#0E1635;--cartao:#16204A;--texto:#F5F0DC;--suave:#D3CEBC;--linha:rgba(245,240,220,.18);
    --faixa:#EFAD4C;--faixa-texto:#13215E;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);font-size:18px;line-height:1.5;color:var(--texto);background:var(--fundo);-webkit-font-smoothing:antialiased;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dourado);outline-offset:3px;border-radius:8px}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1;font-optical-sizing:none;font-variation-settings:"opsz" 11}
.conteiner{width:100%;padding:0 clamp(1rem,4vw,3rem)}
.oculto{display:none !important}

/* topo: faixa azul com a logo */
.topo{background:#13215E;color:#F5F0DC;padding-top:1.4rem;padding-bottom:1.4rem}
.topo-linha{display:flex;align-items:center;gap:1rem;padding-bottom:.9rem;border-bottom:2px solid #EFAD4C}
.topo-linha img{height:64px;width:auto;flex-shrink:0}
.topo h1{font-size:2.6rem;line-height:1;color:#FFFFFF}
.aviso-precos{font-size:.95rem;color:rgba(245,240,220,.85);margin-top:.6rem}
.busca{display:block;position:relative;margin-top:1rem}
.busca svg{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);width:24px;height:24px;color:#3C4566}
.busca input{width:100%;min-height:56px;padding:.7rem 1rem .7rem 3.2rem;border:0;border-radius:12px;background:#FFFFFF;color:#13215E;font-size:19px}
.busca input::placeholder{color:#5A6283}
.busca input:focus{outline:3px solid #EFAD4C;outline-offset:2px}

/* indice de categorias, como o sumario de um cardapio */
.cats-area{margin-top:1.6rem}
.cats-titulo{display:block;font-family:var(--serif);font-weight:600;font-size:1.5rem;margin-bottom:.3rem;font-optical-sizing:none;font-variation-settings:"opsz" 11}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1.2rem}
.cats a{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:54px;padding:.4rem 0;border-bottom:1px solid var(--linha);color:var(--texto);text-decoration:none;font-weight:600;font-size:1.05rem;line-height:1.25}
.cats a svg{width:18px;height:18px;flex-shrink:0;color:var(--dourado)}

/* categorias */
.cardapio{padding:.5rem 0 2rem}
#cardapio{display:grid;grid-template-columns:minmax(0,1fr);column-gap:2.5rem}
.categoria{margin-top:2.2rem;scroll-margin-top:1rem}
.banner{position:relative;height:200px;border-radius:14px;overflow:hidden;margin-bottom:.4rem;background:#13215E;border:1px solid var(--linha)}
.banner img{width:100%;height:100%;object-fit:cover;background:#FFFFFF}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:65%;background:linear-gradient(180deg,rgba(19,33,94,0) 0%,rgba(19,33,94,.9) 100%);pointer-events:none}
.banner h2{position:absolute;left:1rem;right:1rem;bottom:.85rem;z-index:1;color:#FFFFFF;font-size:2rem}
.na-foto{font-size:.95rem;color:var(--suave);margin:.1rem 0 .3rem;line-height:1.35}
.buscando .na-foto{display:none}
.banner.sem-foto{background:#13215E repeating-linear-gradient(135deg,rgba(239,173,76,.16) 0 2px,transparent 2px 16px)}
.banner.sem-foto::after{display:none}
.titulo-simples{font-size:1.9rem;padding-bottom:.4rem;border-bottom:3px solid var(--dourado);margin-bottom:.2rem}
.buscando .banner{display:none}
.buscando .titulo-simples{display:block !important}

/* itens */
.item{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item-info{flex:1;min-width:0}
.item-nome{font-weight:600;font-size:1.15rem;line-height:1.3}
.tag{display:inline-block;font-size:.8rem;font-weight:700;background:var(--dourado);color:#13215E;padding:1px 8px;border-radius:999px;margin-left:.45rem;vertical-align:2px}
.item-desc{font-size:.98rem;color:var(--suave);margin-top:.15rem;line-height:1.4}
.item-preco{font-weight:700;font-size:1.2rem;white-space:nowrap}
.vazio{text-align:center;color:var(--suave);padding:2.5rem 0;font-size:1.1rem}

/* faixa fixa */
.faixa{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--faixa);color:var(--faixa-texto);padding:.9rem 1rem calc(.9rem + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:.8rem;font-weight:700;font-size:1.1rem;text-align:center}
.faixa svg{width:26px;height:26px;flex-shrink:0}
.subir{position:fixed;right:1rem;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));z-index:21;min-height:52px;padding:0 1.1rem;border-radius:999px;border:2px solid var(--linha);background:var(--cartao);color:var(--texto);font-weight:700;font-size:1rem;display:flex;align-items:center;gap:.4rem;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
.subir svg{width:20px;height:20px}

.rodape{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;padding-top:1rem;padding-bottom:1.5rem;margin-top:1rem;border-top:1px solid var(--linha);color:var(--suave);font-size:.95rem}

@media (min-width:720px){
  .topo h1{font-size:3.2rem}
  .busca{max-width:640px}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  #cardapio{grid-template-columns:repeat(2,minmax(0,1fr))}
  .banner{height:230px}
}
@media (min-width:1100px){
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
  #cardapio{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="topo conteiner" id="inicio">
  <div class="topo-linha">
    <img src="../img/logo-creme.webp" alt="Pão &amp; Tradição" width="68" height="64">
    <h1>Cardápio</h1>
  </div>
  <p class="aviso-precos">Preços em reais.</p>
  <label class="busca">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="busca" placeholder="Procurar um produto" aria-label="Procurar um produto" autocomplete="off">
  </label>
</header>

<main class="conteiner">
  <nav aria-label="Categorias" id="cats-area" class="cats-area">
    <span class="cats-titulo">Categorias</span>
    <div class="cats" id="cats"></div>
  </nav>

  <section class="cardapio">
    <div id="cardapio"><p class="vazio">Carregando cardápio...</p></div>
    <p class="vazio oculto" id="vazio-busca">Nenhum produto encontrado com esse nome.</p>
  </section>
</main>

<footer class="rodape conteiner"><span>© <span id="ano">2026</span> Pão &amp; Tradição</span><span>padariapaoetradicao.com.br</span></footer>

<button class="subir oculto" id="subir" onclick="document.getElementById('inicio').scrollIntoView()" aria-label="Voltar ao início">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>Início
</button>

<div class="faixa" role="note">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  Para pedir, chame o atendente
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = v => Number(v).toFixed(2).replace(".", ",");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* Os dados vem do mesmo lugar do delivery: aba Cardapio do painel (admin).
   Se nada estiver salvo no painel, vale o dados.js desta pasta. */
const FIREBASE = { apiKey: "AIzaSyAbWca-fYMQgvQl7otkHZibptOox1NTFN4", projectId: "planner-c01a1" };
const FS = "https://firestore.googleapis.com/v1/projects/" + FIREBASE.projectId + "/databases/(default)/documents/";
function decFS(v){
  if (!v) return undefined;
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(decFS);
  if ("mapValue" in v) { const o = {}; Object.entries(v.mapValue.fields || {}).forEach(([k, x]) => o[k] = decFS(x)); return o; }
  return undefined;
}
async function buscar(doc){
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(FS + "vitrine/" + doc + "?key=" + FIREBASE.apiKey, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) return null;
    const j = await r.json();
    return decFS({ mapValue: { fields: j.fields || {} } });
  } catch (e) { return null; }
}
async function carregarDados(){
  let d = null;
  const res = await buscar("resumo");
  if (res && res.v === 1) { if (res.cardapio && res.cardapio.categorias && res.cardapio.categorias.length) d = res.cardapio; }
  else { const o = await buscar("cardapio"); if (o && o.categorias && o.categorias.length) d = o; }
  if (!d) d = window.CARDAPIO_PADRAO;
  return d;
}

const SETA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
function render(d){
  const cats = d.categorias.map(c => ({ chave: c.chave, titulo: c.titulo, foto: c.foto || "", legenda: c.fotoNome || c.legenda || "", itens: (c.itens || []).filter(it => it.ativo !== false && it.n) })).filter(c => c.itens.length);
  const adicionais = (d.adicionais || []).filter(a => a.n);
  if (adicionais.length && !cats.some(c => semAcento(c.titulo) === "adicionais")) cats.push({ chave: "adicionais", titulo: "Adicionais", foto: "", legenda: "", itens: adicionais.map(a => ({ n: a.n, p: a.p })) });
  // se alguma categoria tem foto, todas ganham banner; as sem foto ficam com a faixa azul da marca
  const algumaFoto = cats.some(c => c.foto);
  const linha = it => `
    <div class="item" data-busca="${esc(semAcento(it.n + " " + (it.d || "")))}">
      <div class="item-info">
        <div class="item-nome">${esc(it.n)}${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}</div>
        ${it.d ? `<div class="item-desc">${esc(it.d)}</div>` : ""}
      </div>
      <span class="item-preco">${fmt(it.p)}</span>
    </div>`;
  const banner = c => {
    if (!algumaFoto) return "";
    if (!c.foto) return `<div class="banner sem-foto"><h2>${esc(c.titulo)}</h2></div>`;
    return `<div class="banner"><img src="${esc(c.foto)}" alt="${esc(c.legenda)}" loading="lazy" onerror="this.parentNode.classList.add('sem-foto');this.remove()"><h2>${esc(c.titulo)}</h2></div>${c.legenda ? `<p class="na-foto">Na foto: ${esc(c.legenda)}</p>` : ""}`;
  };
  $("cardapio").innerHTML = cats.map(c => `
    <section class="categoria" id="${esc(c.chave)}">
      ${banner(c)}
      <h2 class="titulo-simples"${algumaFoto ? ' style="display:none"' : ""}>${esc(c.titulo)}</h2>
      <div class="lista">${c.itens.map(linha).join("")}</div>
    </section>`).join("");
  $("cats").innerHTML = cats.map(c => `<a href="#${esc(c.chave)}">${esc(c.titulo)}${SETA}</a>`).join("");
}

$("busca").addEventListener("input", e => {
  const q = semAcento(e.target.value.trim());
  let algum = false;
  document.querySelectorAll(".categoria").forEach(sec => {
    let vis = 0;
    sec.querySelectorAll(".item").forEach(it => {
      const ok = !q || it.dataset.busca.includes(q);
      it.classList.toggle("oculto", !ok); if (ok) vis++;
    });
    sec.classList.toggle("oculto", vis === 0);
    if (vis) algum = true;
  });
  $("cats-area").classList.toggle("oculto", !!q);
  document.body.classList.toggle("buscando", !!q);
  $("vazio-busca").classList.toggle("oculto", algum);
});

addEventListener("scroll", () => { $("subir").classList.toggle("oculto", scrollY < 600); }, { passive: true });
$("ano").textContent = new Date().getFullYear();
carregarDados().then(render).catch(() => { $("cardapio").innerHTML = '<p class="vazio">Não foi possível carregar o cardápio. Peça ajuda ao atendente.</p>'; });
</script>
</body>
</html>
