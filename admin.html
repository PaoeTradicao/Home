<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vitrine | Painel Pão & Tradição</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#13215E;--dourado:#EFAD4C;--creme:#F5F0DC;--fundo:#FDFBF5;--branco:#fff;--suave:#5A6283;--linha:rgba(19,33,94,.12);--erro:#B23B3B;
  --serif:'Bodoni Moda',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--azul);background:var(--fundo);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--dourado);outline-offset:2px;border-radius:6px}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.1}
.oculto{display:none !important}
.conteiner{max-width:880px;margin:0 auto;padding:0 1.25rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:0 1.3rem;border-radius:999px;border:0;font-weight:600;cursor:pointer;text-decoration:none;transition:background-color .2s,border-color .2s}
.btn-azul{background:var(--azul);color:var(--creme)}
.btn-azul:hover{background:#1D2E7C}
.btn-ouro{background:var(--dourado);color:var(--azul)}
.btn-contorno{background:transparent;border:1.5px solid var(--linha);color:var(--azul)}
.btn-contorno:hover{border-color:var(--azul)}
.btn:disabled{opacity:.5;cursor:default}
.icone{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linha);background:var(--branco);display:grid;place-items:center;cursor:pointer;color:var(--azul)}
.icone:hover{border-color:var(--azul)}
.icone:disabled{opacity:.3;cursor:default}
.icone svg{width:18px;height:18px}
.icone.perigo:hover{border-color:var(--erro);color:var(--erro)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.login-caixa{width:100%;max-width:380px;background:var(--branco);border:1px solid var(--linha);border-radius:28px;padding:2.5rem 2rem;text-align:center}
.login-caixa img{width:96px;margin:0 auto 1.25rem}
.login-caixa h1{font-size:1.8rem}
.login-caixa p{color:var(--suave);margin:.4rem 0 1.75rem;font-size:.95rem}
.campo{display:grid;gap:.35rem;text-align:left;margin-bottom:1rem}
.campo label{font-size:.875rem;font-weight:600}
.campo input,.campo textarea,.campo select{width:100%;min-height:46px;padding:.6rem .9rem;border:1.5px solid var(--linha);border-radius:12px;background:var(--branco)}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo textarea:focus{border-color:var(--azul);outline:none}
.campo small{color:var(--suave);font-size:.8rem}
.msg-erro{color:var(--erro);font-size:.9rem;margin-top:.75rem;min-height:1.3em}

/* topo */
.topo{background:var(--branco);border-bottom:1px solid var(--linha)}
.topo .conteiner{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:72px}
.topo img{height:52px}
.topo-acoes{display:flex;gap:.6rem;align-items:center}
.topo-acoes .btn{min-height:40px;padding:0 1rem;font-size:.9rem}

.cabecalho{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin:2.5rem 0 1.5rem}
.cabecalho h1{font-size:2.2rem}
.cabecalho p{color:var(--suave);margin-top:.3rem}

/* lista */
.lista{display:grid;gap:.75rem;padding-bottom:4rem}
.item{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;background:var(--branco);border:1px solid var(--linha);border-radius:20px;padding:.9rem}
.item.inativo{opacity:.55}
.item-foto{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--creme)}
.item-nome{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.2}
.item-preco{font-size:.95rem;margin-top:.15rem}
.item-preco b{border-bottom:2px solid var(--dourado)}
.item-desc{font-size:.875rem;color:var(--suave);margin-top:.15rem}
.item-tag{display:inline-block;font-size:.75rem;font-weight:600;background:var(--creme);padding:1px 8px;border-radius:999px;margin-left:.4rem;vertical-align:2px}
.item-acoes{grid-column:1 / -1;display:flex;gap:.4rem;justify-content:flex-end;border-top:1px solid var(--linha);padding-top:.75rem}
.item-acoes .espaco{flex:1}
.vazio{text-align:center;background:var(--branco);border:1.5px dashed var(--linha);border-radius:24px;padding:3rem 1.5rem}
.vazio p{color:var(--suave);margin:.5rem auto 1.5rem;max-width:40ch}

/* modal */
.fundo-modal{position:fixed;inset:0;background:rgba(19,33,94,.45);display:grid;place-items:end center;z-index:50;padding:0}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--fundo);border-radius:28px 28px 0 0;padding:1.75rem 1.5rem 2rem}
.modal h2{font-size:1.7rem;margin-bottom:1.25rem}
.foto-escolha{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem}
.foto-escolha img,.foto-vazia{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--creme);flex-shrink:0}
.foto-vazia{display:grid;place-items:center;color:var(--suave);font-size:.8rem;text-align:center;padding:1rem}
.foto-escolha .info{font-size:.85rem;color:var(--suave)}
.preco-linha{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.prefixo{position:relative}
.prefixo span{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--suave)}
.prefixo input{padding-left:2.4rem}
.check{display:flex;align-items:center;gap:.6rem;margin:.25rem 0 1.5rem;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--azul)}
.modal-acoes{display:flex;gap:.6rem;justify-content:flex-end}

.aviso{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--azul);color:var(--creme);padding:.8rem 1.3rem;border-radius:999px;font-size:.95rem;z-index:60;box-shadow:0 10px 30px rgba(19,33,94,.3)}

@media (min-width:640px){
  .item{grid-template-columns:auto 1fr auto}
  .item-acoes{grid-column:auto;border-top:0;padding-top:0}
  .item-acoes .espaco{display:none}
  .fundo-modal{place-items:center;padding:1.5rem}
  .modal{border-radius:28px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="tela-login">
  <form class="login-caixa" id="form-login">
    <img src="img/logo.webp" alt="Pão & Tradição">
    <h1>Vitrine do site</h1>
    <p>Entre para editar os produtos e preços.</p>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-azul" style="width:100%" id="btn-entrar">Entrar</button>
    <div class="msg-erro" id="erro-login"></div>
  </form>
</section>

<!-- PAINEL -->
<section class="oculto" id="tela-painel">
  <header class="topo">
    <div class="conteiner">
      <img src="img/logo.webp" alt="Pão & Tradição">
      <div class="topo-acoes">
        <a class="btn btn-contorno" href="index.html" target="_blank">Ver site</a>
        <button class="btn btn-contorno" id="btn-sair">Sair</button>
      </div>
    </div>
  </header>
  <main class="conteiner">
    <div class="cabecalho">
      <div>
        <h1>Hoje na vitrine</h1>
        <p>Os produtos aparecem no site nesta ordem. Mudanças entram no ar na hora.</p>
      </div>
      <button class="btn btn-ouro" id="btn-novo">Novo produto</button>
    </div>
    <div class="lista" id="lista"></div>
  </main>
</section>

<!-- MODAL -->
<div class="fundo-modal oculto" id="modal">
  <form class="modal" id="form-produto">
    <h2 id="modal-titulo">Novo produto</h2>
    <div class="foto-escolha">
      <div id="foto-preview"><div class="foto-vazia">Sem foto</div></div>
      <div>
        <label class="btn btn-contorno" for="foto-arquivo">Escolher foto</label>
        <input id="foto-arquivo" type="file" accept="image/*" class="oculto">
        <p class="info" style="margin-top:.5rem">A foto é cortada em círculo e reduzida automaticamente.</p>
      </div>
    </div>
    <div class="campo"><label for="p-nome">Nome</label><input id="p-nome" maxlength="40" required></div>
    <div class="campo"><label for="p-desc">Descrição curta</label><textarea id="p-desc" maxlength="90"></textarea><small>Até 90 caracteres.</small></div>
    <div class="preco-linha">
      <div class="campo"><label for="p-preco">Preço</label><div class="prefixo"><span>R$</span><input id="p-preco" inputmode="decimal" placeholder="0,00" required></div></div>
      <div class="campo"><label for="p-obs">Complemento</label>
        <input id="p-obs" list="obs-opcoes" placeholder="Opcional">
        <datalist id="obs-opcoes"><option value="a partir de"><option value="por 100g"><option value="por kg"><option value="unidade"></datalist>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="p-ativo" checked> Mostrar no site</label>
    <div class="modal-acoes">
      <button type="button" class="btn btn-contorno" id="btn-cancelar">Cancelar</button>
      <button class="btn btn-azul" id="btn-salvar">Salvar</button>
    </div>
  </form>
</div>

<div class="aviso oculto" id="aviso"></div>

<script type="module">
/* =====================================================================
   CONFIGURACAO DO FIREBASE (cole aqui os dados do seu projeto)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAbWca-fYMQgvQl7otkHZibptOox1NTFN4",
  authDomain: "planner-c01a1.firebaseapp.com",
  projectId: "planner-c01a1",
  storageBucket: "planner-c01a1.firebasestorage.app",
  messagingSenderId: "1049821121203",
  appId: "1:1049821121203:web:f3b3f23c01043543c03ec6"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const aviso = texto => {
  const a = $('#aviso'); a.textContent = texto; a.classList.remove('oculto');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add('oculto'), 2600);
};

if (!firebaseConfig.projectId) {
  $('#erro-login').textContent = 'Firebase ainda não configurado neste arquivo.';
  $('#btn-entrar').disabled = true;
  throw new Error('Firebase sem configuracao');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const col = collection(db, 'vitrine');

let produtos = [];
let editando = null;
let fotoAtual = '';
let pararLista = null;

/* ---------- LOGIN ---------- */
$('#form-login').addEventListener('submit', async e => {
  e.preventDefault();
  $('#erro-login').textContent = '';
  $('#btn-entrar').disabled = true;
  try {
    await signInWithEmailAndPassword(auth, $('#email').value.trim(), $('#senha').value);
  } catch (err) {
    $('#erro-login').textContent = 'E-mail ou senha incorretos.';
  } finally {
    $('#btn-entrar').disabled = false;
  }
});
$('#btn-sair').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $('#tela-login').classList.toggle('oculto', !!user);
  $('#tela-painel').classList.toggle('oculto', !user);
  if (user) {
    pararLista = onSnapshot(col, snap => {
      produtos = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
      desenhar();
    }, () => aviso('Sem permissão para ler a vitrine. Confira as regras do Firestore.'));
  } else if (pararLista) {
    pararLista(); pararLista = null;
  }
});

/* ---------- LISTA ---------- */
const svg = {
  cima: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>',
  baixo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  editar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  excluir: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'
};
function botao(html, titulo, acao, desativado, extra){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'icone' + (extra ? ' ' + extra : '');
  b.innerHTML = html; b.title = titulo; b.setAttribute('aria-label', titulo);
  b.disabled = !!desativado; b.onclick = acao;
  return b;
}
function desenhar(){
  const lista = $('#lista');
  lista.textContent = '';
  if (!produtos.length) {
    lista.innerHTML = '<div class="vazio"><h2>Vitrine vazia</h2><p>Cadastre o primeiro produto ou importe os que já estão no site hoje.</p><button class="btn btn-azul" id="btn-importar">Importar produtos atuais</button></div>';
    $('#btn-importar').onclick = importar;
    return;
  }
  produtos.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'item' + (p.ativo === false ? ' inativo' : '');
    const img = document.createElement('img'); img.className = 'item-foto'; img.alt = '';
    if (p.foto) img.src = p.foto;
    const txt = document.createElement('div');
    const nome = document.createElement('div'); nome.className = 'item-nome'; nome.textContent = p.nome;
    if (p.ativo === false) { const t = document.createElement('span'); t.className = 'item-tag'; t.textContent = 'oculto'; nome.appendChild(t); }
    const preco = document.createElement('div'); preco.className = 'item-preco';
    const b = document.createElement('b'); b.textContent = p.preco;
    const o = p.obs || '';
    if (o.toLowerCase().startsWith('a partir')) preco.append(o + ' ', b); else preco.append(b, o ? ' ' + o : '');
    const d = document.createElement('div'); d.className = 'item-desc'; d.textContent = p.descricao || '';
    txt.append(nome, preco, d);
    const ac = document.createElement('div'); ac.className = 'item-acoes';
    const esp = document.createElement('span'); esp.className = 'espaco';
    ac.append(
      botao(svg.cima, 'Subir', () => trocar(i, i - 1), i === 0),
      botao(svg.baixo, 'Descer', () => trocar(i, i + 1), i === produtos.length - 1),
      esp,
      botao(svg.editar, 'Editar', () => abrir(p)),
      botao(svg.excluir, 'Excluir', () => excluir(p), false, 'perigo')
    );
    el.append(img, txt, ac);
    lista.appendChild(el);
  });
}
async function trocar(a, b){
  const batch = writeBatch(db);
  produtos.forEach((p, i) => {
    let nova = i; if (i === a) nova = b; else if (i === b) nova = a;
    if (p.ordem !== nova) batch.update(doc(db, 'vitrine', p.id), { ordem: nova });
  });
  try { await batch.commit(); } catch (e) { aviso('Não foi possível mudar a ordem.'); }
}
async function excluir(p){
  if (!confirm('Excluir "' + p.nome + '" da vitrine?')) return;
  try { await deleteDoc(doc(db, 'vitrine', p.id)); aviso('Produto excluído.'); }
  catch (e) { aviso('Não foi possível excluir.'); }
}

/* ---------- FORMULARIO ---------- */
function mostrarFoto(src){
  $('#foto-preview').innerHTML = src ? '<img alt="">' : '<div class="foto-vazia">Sem foto</div>';
  if (src) $('#foto-preview img').src = src;
}
function abrir(p){
  editando = p || null;
  fotoAtual = p ? (p.foto || '') : '';
  $('#modal-titulo').textContent = p ? 'Editar produto' : 'Novo produto';
  $('#p-nome').value = p ? p.nome : '';
  $('#p-desc').value = p ? (p.descricao || '') : '';
  $('#p-preco').value = p ? String(p.preco || '').replace(/^R\$\s*/, '') : '';
  $('#p-obs').value = p ? (p.obs || '') : '';
  $('#p-ativo').checked = p ? p.ativo !== false : true;
  $('#foto-arquivo').value = '';
  mostrarFoto(fotoAtual);
  $('#modal').classList.remove('oculto');
  setTimeout(() => $('#p-nome').focus(), 50);
}
function fechar(){ $('#modal').classList.add('oculto'); editando = null; }
$('#btn-novo').onclick = () => abrir(null);
$('#btn-cancelar').onclick = fechar;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fechar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

// Reduz e recorta a foto em quadrado de 600px
function processarImagem(fonte){
  return new Promise((ok, falha) => {
    const img = new Image();
    img.onload = () => {
      const lado = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - lado) / 2, sy = (img.naturalHeight - lado) / 2;
      const c = document.createElement('canvas'); c.width = c.height = 600;
      c.getContext('2d').drawImage(img, sx, sy, lado, lado, 0, 0, 600, 600);
      let url = c.toDataURL('image/webp', 0.78);
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', 0.82);
      let q = 0.7;
      while (url.length > 400000 && q > 0.35) { url = c.toDataURL('image/jpeg', q); q -= 0.1; }
      ok(url);
    };
    img.onerror = falha;
    img.src = fonte;
  });
}
$('#foto-arquivo').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  try { fotoAtual = await processarImagem(url); mostrarFoto(fotoAtual); }
  catch (err) { aviso('Não foi possível ler essa imagem.'); }
  finally { URL.revokeObjectURL(url); }
});

$('#form-produto').addEventListener('submit', async e => {
  e.preventDefault();
  if (!fotoAtual) { aviso('Escolha uma foto para o produto.'); return; }
  const precoTxt = $('#p-preco').value.trim().replace(/^R\$\s*/, '').replace('.', ',');
  const dados = {
    nome: $('#p-nome').value.trim(),
    descricao: $('#p-desc').value.trim(),
    preco: 'R$ ' + precoTxt,
    obs: $('#p-obs').value.trim(),
    ativo: $('#p-ativo').checked,
    foto: fotoAtual,
    atualizadoEm: serverTimestamp()
  };
  $('#btn-salvar').disabled = true;
  try {
    if (editando) await updateDoc(doc(db, 'vitrine', editando.id), dados);
    else await addDoc(col, { ...dados, ordem: produtos.length });
    aviso('Produto salvo. Já está no site.');
    fechar();
  } catch (err) {
    aviso('Não foi possível salvar. Tente de novo.');
  } finally {
    $('#btn-salvar').disabled = false;
  }
});

/* ---------- IMPORTAR PRODUTOS ATUAIS ---------- */
const iniciais = [
  { nome: "Pastelzinho", descricao: "Crocante por fora, bem recheado por dentro.", preco: "R$ 5,99", obs: "por 100g", arquivo: "img/pastelzinho.webp" },
  { nome: "Mini salgados", descricao: "Coxinha, quibe, enroladinho e muito mais.", preco: "R$ 4,99", obs: "a partir de", arquivo: "img/mini-salgados.webp" },
  { nome: "Brownie recheado", descricao: "Artesanal, feito todos os dias.", preco: "R$ 13,00", obs: "", arquivo: "img/brownie.webp" },
  { nome: "Café", descricao: "Passado na hora, desde as 6h da manhã.", preco: "R$ 3,00", obs: "a partir de", arquivo: "img/cafe.webp" },
  { nome: "Salgados fritos", descricao: "Fritos na hora, sempre quentinhos.", preco: "R$ 7,25", obs: "a partir de", arquivo: "img/salgados-fritos.webp" }
];
async function importar(){
  const b = $('#btn-importar'); b.disabled = true; b.textContent = 'Importando...';
  try {
    for (let i = 0; i < iniciais.length; i++) {
      const p = iniciais[i];
      const foto = await processarImagem(p.arquivo);
      await addDoc(col, { nome: p.nome, descricao: p.descricao, preco: p.preco, obs: p.obs, ativo: true, foto, ordem: i, atualizadoEm: serverTimestamp() });
    }
    aviso('Produtos importados.');
  } catch (err) {
    aviso('Falha ao importar. Abra o painel pelo endereço do site.');
    b.disabled = false; b.textContent = 'Importar produtos atuais';
  }
}
</script>
</body>
</html>
